services:
  - type: web
    name: playerup-bumper-web
    runtime: python
    plan: pro
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn playerup_dashboard.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - fromGroup: playerup-bumper-env
      - key: DATABASE_URL
        fromDatabase:
          name: playerup-db
          property: connectionString

  - type: worker
    name: playerup-bumper-worker
    runtime: python
    plan: pro
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_bumper
    autoDeployTrigger: commit
    envVars:
      - fromGroup: playerup-bumper-env
      - key: DATABASE_URL
        fromDatabase:
          name: playerup-db
          property: connectionString

envVarGroups:
  - name: playerup-bumper-env
    envVars:
      - key: PLAYERUP_SESSION_COOKIE
        sync: false
      - key: PLAYERUP_USERNAME
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: BUMP_INTERVAL_MINUTES
        value: "30"
      - key: RENDER
        value: "true"

databases:
  - name: playerup-db
    databaseName: playerup_dashboard
    user: playerup_user
    plan: pro-4gb
