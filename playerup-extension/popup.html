<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PlayerUp Sync Panel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.787 1.4 8.168L12 18.896l-7.334 3.857 1.4-8.168L.132 9.21l8.2-1.192L12 .587z"/>
        </svg>
      </div>
      <h1>PlayerUp Sync</h1>
    </header>
    
    <div class="status-card">
      <div class="status-indicator" id="statusDot"></div>
      <div class="status-text" id="statusText">Checking status...</div>
    </div>
    
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Last Sync</div>
        <div class="stat-value" id="lastSync">Never</div>
      </div>
      <div class="stat">
        <div class="stat-label">Listings</div>
        <div class="stat-value" id="listingCount">0</div>
      </div>
    </div>
    
    <div class="actions">
      <button class="btn-primary" id="syncNow">Sync Now</button>
      <button class="btn-secondary" id="openDashboard">Open Dashboard</button>
    </div>
    
    <div class="settings">
      <label for="backendUrl">Backend URL:</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="backendUrl" placeholder="https://your-app.onrender.com">
        <button id="saveSettings">Save</button>
      </div>
    </div>

    <!-- Floating toast alerts inside popup -->
    <div id="popupToast" class="toast hidden">Settings saved!</div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
